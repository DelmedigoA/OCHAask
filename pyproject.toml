[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ochask"
version = "0.1.0"
description = "Bearing Witness Research Workspace for OCHA reports and project archives"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "pydantic-ai-slim[ag-ui,mcp,openai,web]>=2.68.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34",
]

[project.scripts]
ochask-index-bearing-witness-document = "ochask.bearing_witness_ingest:main"

[dependency-groups]
local = [
    "docling>=2.150.1",
    "langchain>=1.5.0",
    "langchain-text-splitters>=1.1.3",
    "mlx-vlm>=0.7.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pymupdf>=2.1",
    "tiktoken>=0.14.0",
]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
bm25 = [
    "bm25s>=0.3.16",
]

[tool.vercel]
entrypoint = "src.ochask.web.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ochask = ["prompts/*.md", "data/*.json", "data/project-metadata/*.json", "data/faqs/bearing-witness/*.json"]
"ochask.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/package.json", "static/vendor/pdfjs/*.mjs", "static/vendor/pdfjs/LICENSE", "static/vendor/marked/*.js", "static/vendor/marked/LICENSE", "static/workspace/*", "static/workspace/assets/*"]
