[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ochask"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docling>=2.150.1",
    "langchain>=1.5.0",
    "langchain-text-splitters>=1.1.3",
    "mlx-vlm>=0.7.12",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pip>=26.3",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pymupdf>=2.1",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "pydantic-ai-slim[ag-ui,openai,web]>=2.68.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ochask = ["prompts/*.md"]
"ochask.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/package.json", "static/vendor/pdfjs/*.mjs", "static/vendor/pdfjs/LICENSE", "static/vendor/marked/*.js", "static/vendor/marked/LICENSE", "static/workspace/*", "static/workspace/assets/*"]
